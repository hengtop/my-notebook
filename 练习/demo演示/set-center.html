<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>center</title>
  <style>
    .container {
      height: 300px;
      width: 100%;
      background-color: pink;
      text-align: center;
    }

    .level {
      width: 200px;
      height: 200px;
      background-color: red;
      display: inline-block;
      vertical-align: middle;
    }

    .container::before {
      content: '';
      display: inline-block;
      height: 100%;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="level">垂直居中</div>
  </div>
</body>

</html>
